<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Math Practice</title>
    <meta name="description" content="Math facts, multi-digit arithmetic, fractions and decimals practice with full progress history. Works offline." />
    <meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Math Practice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header" id="app-header">
      <a class="brand" href="#/" aria-label="Math Practice home">
        <img src="icons/icon.svg" alt="" width="32" height="32" />
        <span>Math Practice</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/" data-tab="home"><span class="tab-icon" aria-hidden="true">🏠</span><span>Home</span></a>
        <a href="#/setup" data-tab="setup"><span class="tab-icon" aria-hidden="true">🛠️</span><span>Build</span></a>
        <a href="#/stats" data-tab="stats"><span class="tab-icon" aria-hidden="true">📈</span><span>Stats</span></a>
        <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">⚙️</span><span>Settings</span></a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <noscript><p class="card">Math Practice needs JavaScript turned on.</p></noscript>
      <p class="loading">Loading…</p>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
